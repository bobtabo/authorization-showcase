# Python（Django）CI ワークフロー
# developブランチの backends/python-django/** 変更時に CI を実行
name: Python（Django）CI

on:
  push:
    branches-ignore:
      - 'feature/issue-*'
    paths:
      - 'backends/python-django/**'
  workflow_dispatch:

# 全バックエンドCIが同一のngrokトンネル/LocalStackを共有しているため、
# 同時実行すると輻輳して502エラーになることがある。直列実行させて防ぐ。
concurrency:
  group: shared-authserver-tunnel
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # リポジトリをチェックアウト
      - uses: actions/checkout@v4

      # Python 3.13 をセットアップ
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      # pip で依存パッケージをインストール
      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: backends/python-django

      # ngrok経由でLocalStackの現在のAPI Gateway IDを取得し、AUTH_SERVER_URLを組み立てる
      # （IDはLocalStack再起動のたびに変わるため、ハードコードせず実行時に解決する）
      - name: Resolve AUTH_SERVER_URL
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: ap-northeast-1
          NGROK_URL: https://ample-precise-knee.ngrok-free.dev
        run: |
          API_ID=$(aws --endpoint-url="${NGROK_URL}" apigateway get-rest-apis --query 'items[0].id' --output text)
          if [ -z "${API_ID}" ] || [ "${API_ID}" = "None" ]; then
            echo "::error::No API Gateway REST API found via ${NGROK_URL}"
            exit 1
          fi
          echo "AUTH_SERVER_URL=${NGROK_URL}/restapis/${API_ID}/local/_user_request_/function/php" >> "$GITHUB_ENV"

      # 解決した AUTH_SERVER_URL を使って認可サーバー（LocalStack経由）に対するテストを実行
      - name: Run tests
        run: python manage.py test
        working-directory: backends/python-django
