# Python（Django）CI ワークフロー
# developブランチの backends/python-django/** 変更時に CI を実行
name: Python（Django）CI

on:
  push:
    branches:
      - develop
    paths:
      - 'backends/python-django/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: backends/python-django

      - name: Run tests
        run: python manage.py test
        working-directory: backends/python-django
        env:
          AUTH_SERVER_URL: https://ample-precise-knee.ngrok-free.dev/function/php
