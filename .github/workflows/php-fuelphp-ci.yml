# PHP（FuelPHP）CI ワークフロー
# developブランチの backends/php-fuelphp/** 変更時に CI を実行
name: PHP（FuelPHP）CI

on:
  push:
    branches-ignore:
      - 'feature/issue-*'
    paths:
      - 'backends/php-fuelphp/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install dependencies
        run: composer install
        working-directory: backends/php-fuelphp

      - name: Run tests
        run: ./fuel/vendor/bin/phpunit -c fuel/core/phpunit.xml --testsuite app
        working-directory: backends/php-fuelphp
        env:
          AUTH_SERVER_URL: https://ample-precise-knee.ngrok-free.dev/restapis/bg4rg8ca9o/local/_user_request_/function/php
