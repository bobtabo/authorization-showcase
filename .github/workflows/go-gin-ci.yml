# Go（Gin）CI ワークフロー
# developブランチの backends/go-gin/** 変更時に CI を実行
name: Go（Gin）CI

on:
  push:
    branches-ignore:
      - 'feature/issue-*'
    paths:
      - 'backends/go-gin/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'

      - name: Install dependencies
        run: go mod download
        working-directory: backends/go-gin

      - name: Resolve AUTH_SERVER_URL
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: ap-northeast-1
          NGROK_URL: https://ample-precise-knee.ngrok-free.dev
        run: |
          API_ID=$(aws --endpoint-url="${NGROK_URL}" apigateway get-rest-apis --query 'items[0].id' --output text)
          echo "AUTH_SERVER_URL=${NGROK_URL}/restapis/${API_ID}/local/_user_request_/function/php" >> "$GITHUB_ENV"

      - name: Run tests
        run: go test ./...
        working-directory: backends/go-gin
