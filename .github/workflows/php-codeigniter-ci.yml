# PHP（CodeIgniter）CI ワークフロー
# developブランチの backends/php-codeigniter/** 変更時に CI を実行
name: PHP（CodeIgniter）CI

on:
  push:
    branches:
      - develop
    paths:
      - 'backends/php-codeigniter/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install dependencies
        run: composer install
        working-directory: backends/php-codeigniter

      - name: Run tests
        run: ./vendor/bin/phpunit
        working-directory: backends/php-codeigniter
        env:
          AUTH_SERVER_URL: https://ample-precise-knee.ngrok-free.dev/restapis/{api-id}/local/_user_request_
