# PHP（CakePHP）CI ワークフロー
# developブランチの backends/php-cakephp/** 変更時に CI を実行
name: PHP（CakePHP）CI

on:
  push:
    branches-ignore:
      - 'feature/issue-*'
    paths:
      - 'backends/php-cakephp/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: apcu
          ini-values: apc.enable_cli=1

      - name: Install dependencies
        run: composer install
        working-directory: backends/php-cakephp

      - name: Run tests
        run: ./vendor/bin/phpunit
        working-directory: backends/php-cakephp
        env:
          AUTH_SERVER_URL: https://ample-precise-knee.ngrok-free.dev/restapis/bg4rg8ca9o/local/_user_request_/function/php
