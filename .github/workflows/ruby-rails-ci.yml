# Ruby（Rails）CI ワークフロー
# developブランチの backends/ruby-rails/** 変更時に CI を実行
name: Ruby（Rails）CI

on:
  push:
    branches-ignore:
      - 'feature/issue-*'
    paths:
      - 'backends/ruby-rails/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: backends/ruby-rails

      - name: Resolve AUTH_SERVER_URL
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: ap-northeast-1
          NGROK_URL: https://ample-precise-knee.ngrok-free.dev
        run: |
          API_ID=$(aws --endpoint-url="${NGROK_URL}" apigateway get-rest-apis --query 'items[0].id' --output text)
          echo "AUTH_SERVER_URL=${NGROK_URL}/restapis/${API_ID}/local/_user_request_/function/php" >> "$GITHUB_ENV"

      - name: Run tests
        run: bundle exec rails test test/controllers/
        working-directory: backends/ruby-rails
