# Ruby（Rails）CI ワークフロー
# developブランチの backends/ruby-rails/** 変更時に CI を実行
name: Ruby（Rails）CI

on:
  push:
    branches-ignore:
      - 'feature/issue-*'
    paths:
      - 'backends/ruby-rails/**'
  workflow_dispatch:

# 全バックエンドCIが同一のngrokトンネル/LocalStackを共有しているため、
# 同時実行すると輻輳して502エラーになることがある。直列実行させて防ぐ。
concurrency:
  group: shared-authserver-tunnel
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # リポジトリをチェックアウト
      - uses: actions/checkout@v4

      # Ruby 3.4 をセットアップ（bundler-cache: true で bundle install も実行される）
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: backends/ruby-rails

      # ngrok経由でLocalStackの現在のAPI Gateway IDを取得し、AUTH_SERVER_URLを組み立てる
      # （IDはLocalStack再起動のたびに変わるため、ハードコードせず実行時に解決する）
      - name: Resolve AUTH_SERVER_URL
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: ap-northeast-1
          NGROK_URL: https://ample-precise-knee.ngrok-free.dev
        run: |
          API_ID=$(aws --endpoint-url="${NGROK_URL}" apigateway get-rest-apis --query 'items[0].id' --output text)
          if [ -z "${API_ID}" ] || [ "${API_ID}" = "None" ]; then
            echo "::error::No API Gateway REST API found via ${NGROK_URL}"
            exit 1
          fi
          echo "AUTH_SERVER_URL=${NGROK_URL}/restapis/${API_ID}/local/_user_request_/function/php" >> "$GITHUB_ENV"

      # 解決した AUTH_SERVER_URL を使って認可サーバー（LocalStack経由）に対するテストを実行
      - name: Run tests
        run: bundle exec rails test test/controllers/
        working-directory: backends/ruby-rails
