name: showcase-app-java

networks:
  showcase:
    external: true

services:
  nginx:
    container_name: ${NGINX_CONTAINER}
    build: nginx
    ports:
      - '${NGINX_HTTP_PORT}'
    volumes:
      - ./nginx/templates:/etc/nginx/templates
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - java
    environment:
      - APP_NAME=${APP_NAME}
      - SERVER_NAME=${SERVER_NAME}
      - APP_PATH=${APP_PATH}
      - VIRTUAL_HOST=${SERVER_NAME}
      - VIRTUAL_PORT=80
      - LETSENCRYPT_HOST=${SERVER_NAME}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
      - CERT_NAME=default
      - HTTPS_METHOD=noredirect
    networks:
      - showcase

  java:
    container_name: ${JAVA_CONTAINER}
    build: java
    ports:
      - '${JAVA_DEBUG_PORT}:5005'
    volumes:
      - ./../../../backends/java-springboot:/var/www/${APP_NAME}
      - java_build:/var/www/${APP_NAME}/build
      - java_gradle:/var/www/${APP_NAME}/.gradle
      - ./../entrypoint.sh:/entrypoint.sh
    working_dir: /var/www/${APP_NAME}
    env_file:
      - path: ./../.env
        required: false
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    command: ./gradlew bootRun
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      - showcase

volumes:
  java_build:
  java_gradle:
